<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spécialisation Python : des bases à l'IA, avec certificat</title>
<meta name="description" content="Formation Python complète en 7 parties : bases, machine learning, Tkinter, résolution de problèmes, données et API. Projets, examen final et certificat vérifiable."><style>
:root{--paper:#f7f8fc;--ink:#14224a;--tx:#2f3a57;--mu:#5d6985;--ln:#d9deec;--sun:#f2b01e;--sun-tx:#14224a;--leaf:#0b7a54;--card:#fff;--code:#101b3a;--codetx:#dfe7ff;--hero:#14224a;--herotx:#f4f6ff;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--paper:#0c1429;--ink:#eef2ff;--tx:#c9d2ee;--mu:#97a3c6;--ln:#26335c;--leaf:#38c795;--card:#131e3d;--code:#0a1128;--codetx:#dfe7ff;--hero:#0a1128;--color-scheme:dark;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--paper);color:var(--tx);font:17px/1.65 'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
h1,h2,h3{font-family:'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;color:var(--ink);line-height:1.15;margin:0}
a{color:inherit}.w{max-width:1080px;margin:auto;padding:0 22px}
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--ln)}
.top .w{display:flex;align-items:center;gap:22px;min-height:62px}.brand{white-space:nowrap;font:700 1.15rem 'Palatino Linotype',Palatino,Georgia,serif;color:var(--ink);text-decoration:none;margin-right:auto}
.top nav{display:flex;gap:20px}.top nav a{text-decoration:none;color:var(--mu);font-size:.95rem}.top nav a:hover{color:var(--ink)}
.btn{display:inline-block;background:var(--sun);color:var(--sun-tx);padding:13px 24px;border-radius:6px;text-decoration:none;font:700 1rem 'Segoe UI',Roboto,Arial,sans-serif;border:0;cursor:pointer}
.btn:hover{filter:brightness(.95)}.btn.s{background:transparent;color:inherit;border:1.5px solid currentColor}.btn.sm{padding:9px 16px;font-size:.92rem}
.btn:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px}
.hero{background:var(--hero);color:var(--herotx)}.hero .w{display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:center;padding-top:72px;padding-bottom:72px}
.hero h1{color:var(--herotx);font-size:clamp(2.1rem,5vw,3.4rem);letter-spacing:-.01em}.hero p{color:#c3cdf0;max-width:52ch;margin:18px 0 28px;font-size:1.1rem}
.cta{display:flex;gap:12px;flex-wrap:wrap}.hero .btn.s{color:var(--herotx)}
.term{background:#0a1128;border:1px solid #2c3a6b;border-radius:10px;overflow:hidden;font:14px/1.6 Consolas,Menlo,monospace;color:var(--codetx)}
.term b{display:block;background:#17234d;padding:8px 14px;font:600 12px 'Segoe UI',Arial,sans-serif;color:#9fb0e8}
.term pre{margin:0;padding:16px;overflow-x:auto;background:none;color:inherit}.term .o{color:#7ee0b4;opacity:0;animation:show .1s linear 1.1s forwards}
.term small{display:block;padding:0 16px 12px;color:#8d9cd2;font:12px 'Segoe UI',Arial,sans-serif}
@keyframes show{to{opacity:1}}@media(prefers-reduced-motion:reduce){.term .o{animation:none;opacity:1}html{scroll-behavior:auto}}
.facts{background:var(--card);border-bottom:1px solid var(--ln)}.facts .w{display:flex;flex-wrap:wrap;gap:8px 34px;padding-top:18px;padding-bottom:18px;color:var(--ink);font-size:.97rem}
.facts span b{font-weight:700}
section.s{padding:68px 0}section.s h2{font-size:clamp(1.7rem,3.5vw,2.3rem);margin-bottom:14px;max-width:24ch}
.lead{max-width:62ch;color:var(--tx)}.two{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--ln)}.rows li{padding:14px 0;border-bottom:1px solid var(--ln)}.rows b{color:var(--ink)}
.prog{list-style:none;margin:28px 0 0;padding:0}.prog li{display:grid;grid-template-columns:54px 1fr;gap:6px 14px;padding:20px 0;border-top:1px solid var(--ln)}
.pn{font:700 1.7rem 'Palatino Linotype',Palatino,Georgia,serif;color:var(--leaf)}.prog h3{font-size:1.2rem;margin-bottom:4px}.prog p{margin:0;color:var(--mu);font-size:.97rem}
.alt{background:var(--card);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.cert{border:3px double var(--ink);padding:26px 22px;background:#fffdf6;color:#14224a;text-align:center;border-radius:4px;font-family:'Palatino Linotype',Palatino,Georgia,serif}
.cert i{display:block;font-size:1.6rem;margin:10px 0;border-bottom:1px solid #14224a}.cert small{display:block;font-family:'Segoe UI',Arial,sans-serif;font-size:.82rem;color:#4a5578}
.cert svg{width:64px;height:64px;margin-top:10px}
.pay{background:var(--hero);color:var(--herotx);padding:64px 0}.pay h2{color:var(--herotx)}.pay p{color:#c3cdf0}
.gate{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.gate input{padding:13px;border:1px solid #3a4a82;border-radius:6px;font-size:1rem;background:#0a1128;color:#fff;min-width:0;flex:1 1 220px}
#err{color:#ffb4a8;min-height:1.5em;margin-top:8px}
